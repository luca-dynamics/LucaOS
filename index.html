    <style>
      /* CRITICAL: TRANSPARENT BACKGROUND FOR ELECTRON OVERLAY */
      html,
      body {
        background-color: transparent;
        margin: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Custom Scrollbar for Terminal */
      ::-webkit-scrollbar {
        width: 4px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.5);
      }

      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 0px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #ef4444;
      }

      /* Holographic Core Animations */
      .holo-ring {
        transform-style: preserve-3d;
        border-radius: 50%;
      }

      .holo-glow {
        box-shadow:
          0 0 20px currentColor,
          inset 0 0 20px currentColor;
      }

      /* Electron Draggable Region */
      .app-region-drag {
        -webkit-app-region: drag;
      }

      .app-region-no-drag {
        -webkit-app-region: no-drag;
      }

      /* 2050 Upgrade: Volumetric UI Effects */
      .transform-gpu {
        transform: translateZ(0);
        will-change: transform;
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }

        100% {
          background-position: 200% 0;
        }
      }
    </style>
    <!-- Import Map Removed for Local Vite Stability -->

    <link rel="stylesheet" href="/src/index.css" />
    <style>
      #root-loader {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 34%, rgba(45, 212, 191, 0.18), transparent 34%),
          radial-gradient(circle at 18% 18%, rgba(125, 211, 252, 0.12), transparent 30%),
          linear-gradient(135deg, #020407 0%, #080b10 48%, #020407 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        z-index: 9999;
        font-family: 'Inter', system-ui, sans-serif;
        color: #e8fbff;
        transition: opacity 0.5s ease-out;
      }
      #root-loader::before {
        content: "";
        position: absolute;
        inset: 12%;
        border-radius: 999px;
        background:
          linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle, black 0%, transparent 72%);
        opacity: 0.38;
      }
      .loader-orb {
        position: relative;
        width: min(38vw, 184px);
        height: min(38vw, 184px);
        border-radius: 999px;
        border: 1px solid rgba(125, 211, 252, 0.26);
        background:
          radial-gradient(circle at 50% 42%, rgba(232, 251, 255, 0.18), transparent 18%),
          radial-gradient(circle, rgba(45, 212, 191, 0.18) 0%, rgba(14, 165, 233, 0.08) 42%, transparent 70%);
        box-shadow:
          0 0 70px rgba(45, 212, 191, 0.24),
          inset 0 0 38px rgba(125, 211, 252, 0.12);
        animation: luca-loader-breathe 4.8s ease-in-out infinite;
      }
      .loader-orb::before,
      .loader-orb::after {
        content: "";
        position: absolute;
        inset: 18px;
        border-radius: 999px;
        border: 1px solid rgba(232, 251, 255, 0.16);
      }
      .loader-orb::after {
        inset: 44%;
        background: rgba(232, 251, 255, 0.72);
        border: 0;
        filter: blur(10px);
        box-shadow: 0 0 34px rgba(125, 211, 252, 0.46);
      }
      @keyframes luca-loader-breathe {
        0%, 100% { transform: scale(0.98); opacity: 0.82; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      .loader-text {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: clamp(26px, 6vw, 54px);
        letter-spacing: -0.06em;
        font-weight: 700;
        line-height: 0.95;
      }
      .loader-text::after {
        content: "Host-native AI operating system";
        font-size: 10px;
        letter-spacing: 0.28em;
        font-weight: 700;
        text-transform: uppercase;
        color: rgba(186, 230, 253, 0.64);
      }
      .loader-status {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(125, 211, 252, 0.16);
        border-radius: 999px;
        padding: 9px 14px;
        background: rgba(8, 13, 20, 0.54);
        color: rgba(232, 251, 255, 0.76);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        backdrop-filter: blur(18px);
      }
      .loader-status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #5eead4;
        box-shadow: 0 0 18px rgba(94, 234, 212, 0.8);
        animation: luca-loader-pulse 2.8s ease-in-out infinite;
      }
      @keyframes luca-loader-pulse {
        0%, 100% { opacity: 0.45; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>

  <body>
    <div id="root-loader">

      <div class="loader-status">Preparing web-safe interface</div>
    </div>
