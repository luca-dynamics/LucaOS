    <style>
      /* CRITICAL: TRANSPARENT BACKGROUND FOR ELECTRON OVERLAY */
      html,
      body {
        background-color: transparent;
        margin: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Custom Scrollbar for Terminal */
      ::-webkit-scrollbar {
        width: 4px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.5);
      }

      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 0px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #ef4444;
      }

      /* Electron Draggable Region */
      .app-region-drag {
        -webkit-app-region: drag;
      }

      .app-region-no-drag {
        -webkit-app-region: no-drag;
      }

      /* 2050 Upgrade: Volumetric UI Effects */
      .transform-gpu {
        transform: translateZ(0);
        will-change: transform;
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }

        100% {
          background-position: 200% 0;
        }
      }
    </style>

    <style>
      #root-loader {
        position: fixed;
        inset: 0;
        /* Ice-blue glacier environment matched to the hologram's palette,
           same as the native boot splash (boot.html): luminous glow behind
           the face, soft light upper-left, cool base deepening at the edges.
           Pieces are positioned absolutely below; failed state re-centers. */
        background:
          radial-gradient(55% 70% at 72% 42%, rgba(238, 249, 251, 0.92) 0%, rgba(238, 249, 251, 0) 60%),
          radial-gradient(80% 100% at 18% 28%, rgba(243, 250, 252, 0.7) 0%, rgba(243, 250, 252, 0) 55%),
          linear-gradient(160deg, #e2edf2 0%, #d8e4ec 48%, #c9d9e3 100%);
        display: block;
        z-index: 9999;
        font-family: "Segoe UI Variable Display", Inter, "Segoe UI", system-ui, sans-serif;
        color: #2b303a;
        transition: opacity 0.5s ease-out;
        overflow: hidden;
        -webkit-app-region: drag;
      }
      .root-window-controls {
        position: fixed;
        top: 2px;
        right: 2px;
        z-index: 10000;
        display: none;
        align-items: center;
        gap: 2px;
        -webkit-app-region: no-drag;
      }
      html.luca-electron-win .root-window-controls {
        display: flex;
      }
      .root-window-control {
        width: 30px;
        height: 26px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #5b636f;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        transition: color 160ms ease, background 160ms ease;
      }
      .root-window-control:hover {
        color: #2b303a;
        background: rgba(43, 48, 58, 0.06);
      }
      .root-window-control.close:hover {
        color: #d5504a;
        background: rgba(213, 80, 74, 0.1);
      }
      /* Face: clear, on the right half — content sits on the left, the two
         side by side without overlap, exactly as the desktop mockup. Held to
         the right ~46vw so the panel's left column never sits under it. */
      .loader-presence {
        position: absolute;
        right: 4%;
        top: 50%;
        transform: translateY(-50%);
        width: auto;
        /* Scales continuously with the window height; the cap only keeps it
           from becoming cartoonish on very tall displays. */
        height: min(88vh, 820px);
        max-width: 48vw;
        display: grid;
        place-items: center;
        z-index: 1;
      }
      /* The face is a CLEAR presence, per the mockup — bright, fully itself,
         not a ghost dimmed behind the content. Only a soft bottom fade keeps
         the shoulders from ending as a hard cut; the centre stays crisp. */
      .loader-hologram-face {
        position: relative;
        z-index: 1;
        width: auto;
        height: 100%;
        max-width: 100%;
        object-fit: contain;
        opacity: 0.95;
        filter: brightness(1.18) saturate(0.72) contrast(0.98)
          drop-shadow(0 0 20px rgba(216, 243, 248, 0.55));
        -webkit-mask-image:
          linear-gradient(to bottom, black 68%, rgba(0, 0, 0, 0.6) 84%, transparent 98%);
        mask-image:
          linear-gradient(to bottom, black 68%, rgba(0, 0, 0, 0.6) 84%, transparent 98%);
      }
      /* Inline face — the stacked layout's presence, between subtitle and
         checklist. Hidden on wide windows (the absolute face carries it there).
         Given an explicit height so the shared .loader-hologram-face (height:
         100%) has something to fill. */
      .loader-presence-inline {
        display: none;
        justify-content: center;
        height: min(42vh, 360px);
        margin: 6px 0 20px;
      }

      /* ── Second boot, unified with the native splash ──────────────────────
         Loading shows a hairline track + one status line (no heavy card), the
         same calm the native boot.html uses. The card only returns — light —
         at the ready moment. */
      .loader-awaken {
        margin-top: 4px;
      }
      .loader-track {
        position: relative;
        width: 100%;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(43, 48, 58, 0.09);
      }
      .loader-fill {
        height: 100%;
        width: 18%;
        border-radius: 999px;
        background: linear-gradient(90deg, #a6c6e8 0%, #cfe0f2 100%);
        box-shadow: 0 0 10px rgba(127, 169, 216, 0.5);
        transition: width 520ms ease;
      }
      .loader-phase {
        min-height: 15px;
        margin-top: 11px;
        font-size: 13px;
        letter-spacing: 0.01em;
        color: #6b7480;
      }
      /* Ready summary — clean ticked rows, no frosted box. */
      .loader-summary {
        display: none;
        margin-top: 2px;
      }
      .loader-summary .loader-check--ready {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 2px;
        border-bottom: 1px solid rgba(43, 48, 58, 0.06);
      }
      .loader-summary .loader-check--ready:last-child {
        border-bottom: 0;
      }
      /* Ready state: retire the progress cluster, reveal the summary. */
      #root-loader[data-state="ready"] .loader-awaken {
        display: none;
      }
      #root-loader[data-state="ready"] .loader-summary {
        display: block;
      }
      /* Brand: spinner + wordmark + subtitle, center-left. */
      .loader-brand {
        position: absolute;
        left: 8%;
        top: 46%;
        transform: translateY(-50%);
        z-index: 2;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
      }
      /* Spinner + wordmark share one row (spinner centered on the LucaOS
         line); the subtitle sits centered on the line below. */
      .loader-brand-line {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .loader-spinner {
        width: 34px;
        height: 34px;
        flex: none;
        animation: loader-spin 1.5s linear infinite;
      }
      .loader-spinner circle {
        fill: #8b929d;
      }
      .loader-text {
        position: relative;
        z-index: 1;
        font-family:
          "Segoe UI Variable Display",
          Inter,
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        font-size: clamp(30px, min(6vw, 6dvh), 48px);
        letter-spacing: -0.025em;
        font-weight: 600;
        line-height: 1;
        color: #2b303a;
      }
      .loader-subtitle {
        margin-top: 8px;
        text-align: center;
        font-size: 15px;
        letter-spacing: 0.01em;
        font-weight: 500;
        color: #5b636f;
      }
      /* "Starting LucaOS" readiness-checklist layout (the second boot). Left
         panel with brand tag, heading, subtitle and the checklist card; the
         hologram face sits on the right via .loader-presence. */
      .loader-panel {
        position: absolute;
        left: 8%;
        top: 50%;
        transform: translateY(-50%);
        z-index: 2;
        /* Wide enough that the nowrap title and subtitle both sit on one
           line with headroom, instead of clipping. */
        width: min(46vw, 420px);
      }
      /* The brand row is now the sole title: comet spinner + "Starting
         LucaOS" at heading scale, so there's only one wordmark on screen. */
      .loader-brandtag {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 12px;
        /* The title stays on one line — it must never break to "Starting" /
           "LucaOS" as the panel narrows. */
        white-space: nowrap;
        font-family: "Segoe UI Variable Display", Inter, "Segoe UI", system-ui, sans-serif;
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 600;
        letter-spacing: -0.025em;
        line-height: 1.05;
        color: #2b303a;
      }
      .loader-brandtag .loader-spinner {
        width: 30px;
        height: 30px;
        flex: none;
      }
      .loader-lead {
        margin: 0 0 24px;
        font-size: 13.5px;
        line-height: 1.5;
        color: #6b7480;
        /* Stays on one line, same as the title above it. */
        white-space: nowrap;
      }
      .loader-card {
        position: relative;
        border-radius: 18px;
        /* Lens: a thick piece of glass sitting on the glacier. The body
           refracts the backdrop (blur + saturate + a touch of brightness),
           ::before draws the bent light caught in the rim, and ::after lays
           the specular highlights a curved lens would throw. */
        border: none;
        background: linear-gradient(
          150deg,
          rgba(255, 255, 255, 0.46) 0%,
          rgba(255, 255, 255, 0.2) 52%,
          rgba(229, 240, 248, 0.3) 100%
        );
        /* One soft lift instead of four stacked shadows, and a backdrop that
           refracts without repainting the glacier behind it — saturate(1.7)
           plus brightness pushed the colour so hard the card read as a
           different material from the background it sits on. */
        box-shadow:
          0 18px 40px rgba(118, 150, 192, 0.16),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        -webkit-backdrop-filter: blur(22px) saturate(1.25);
        backdrop-filter: blur(22px) saturate(1.25);
        padding: 8px;
      }
      /* Refractive rim — a gradient ring painted only on the border, so the
         edge catches light the way a lens edge bends it. */
      .loader-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.5px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95) 0%,
          rgba(255, 255, 255, 0.28) 24%,
          rgba(168, 211, 238, 0.55) 48%,
          rgba(255, 255, 255, 0.22) 70%,
          rgba(255, 255, 255, 0.9) 100%
        );
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        mask-composite: exclude;
        pointer-events: none;
        z-index: 0;
      }
      /* The specular sweep that used to live here (::after) is deliberately
         gone. The rim above already says "glass"; a second highlight layer on
         a 400px card was the accessory to remove — it read as glare, and glare
         is the opposite of calm. */
      /* Content rides above the lens highlights so the type stays crisp. */
      .loader-check,
      .loader-card-foot {
        position: relative;
        z-index: 1;
      }
      .loader-check {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 11px 13px;
        border-radius: 11px;
        /* Slower than the eye's flicker threshold, so rows settle rather than
           snap as each check resolves. */
        transition: opacity 480ms ease, background 480ms ease;
      }
      .loader-check[data-state="pending"] {
        /* 0.42 -> 0.55: still clearly "not yet", but the step up to done is a
           lift rather than a pop. Four rows popping in sequence read as
           activity; the screen should read as composure. */
        opacity: 0.55;
      }
      .loader-check-icon {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 17px;
        height: 17px;
        color: #7a828c;
      }
      .loader-check-body {
        flex: 1;
        min-width: 0;
      }
      /* Two sizes, not four. 12.5 / 11 / 10.5 / 10.5 sat inside a 2px band —
         too close to read as hierarchy, too far apart to read as one voice, so
         it registered as noise. 13px leads; everything secondary shares 11.5px
         and separates by colour instead. Explicit line-heights give the rows a
         rhythm rather than letting it fall out of the default. */
      .loader-check-title {
        font-size: 13px;
        font-weight: 500;
        line-height: 1.35;
        color: #2b303a;
      }
      .loader-check-detail {
        margin-top: 2px;
        font-size: 11.5px;
        line-height: 1.4;
        color: #8b929d;
      }
      .loader-check-status {
        flex: none;
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        color: #8b929d;
      }
      .loader-check-tick {
        width: 15px;
        height: 15px;
        color: #5c9e78;
      }
      .loader-mini-spin {
        width: 13px;
        height: 13px;
        animation: loader-spin 1.2s linear infinite;
      }
      .loader-mini-spin circle {
        fill: #9aa3ad;
      }
      .loader-card-foot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        padding: 8px 13px 7px;
        font-size: 11.5px;
        color: #8b929d;
      }
      .loader-card-foot svg {
        width: 12px;
        height: 12px;
      }
      /* Returning user: the "Details" disclosure sits left, under a hairline. */
      .loader-card-foot--details {
        justify-content: flex-start;
        gap: 8px;
        margin-top: 2px;
        padding: 10px 11px 8px;
        border-top: 1px solid rgba(43, 48, 58, 0.07);
        font-size: 12px;
      }
      .loader-card-foot--details svg {
        width: 14px;
        height: 14px;
      }
      /* Standalone health pill below the card (returning user). */
      #loader-healthpill:empty {
        display: none;
      }
      .loader-health {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 18px;
        padding: 9px 16px;
        border-radius: 999px;
        font-size: 12.5px;
        color: #5b636f;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 10px 26px rgba(118, 150, 192, 0.16);
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        backdrop-filter: blur(14px) saturate(1.4);
      }
      .loader-health-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #4bb07a;
        box-shadow: 0 0 0 3px rgba(75, 176, 122, 0.18);
      }
      /* Ready gate: settled summary rows — tick left, live status right. */
      .loader-check--ready {
        gap: 13px;
        padding: 9px 12px;
      }
      .loader-check--ready .loader-check-status {
        flex: none;
      }
      .loader-check--ready .loader-check-title {
        flex: 1;
      }
      .loader-ready-value {
        flex: none;
        font-size: 11.5px;
        color: #99a1ab;
      }
      /* Collapsed ready summary (option 3): one confirming line + the five
         service names beneath, instead of five full-width rows. */
      .loader-ready-headline {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 600;
        color: #2b303a;
      }
      .loader-ready-headline .loader-check-tick {
        width: 17px;
        height: 17px;
        flex: none;
      }
      .loader-ready-names {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
        /* Sit under the headline text, clear of the tick. */
        padding-left: 27px;
        font-size: 12px;
        letter-spacing: 0.01em;
        color: #8b929d;
      }
      .loader-ready-names i {
        font-style: normal;
        color: #bcc3cb;
      }
      /* Continue — a frosted aqua pill, full width of the card. */
      .loader-continue {
        display: block;
        width: 100%;
        margin-top: 20px;
        padding: 14px 20px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.65);
        font-family: inherit;
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #ffffff;
        text-shadow: 0 1px 1px rgba(80, 130, 150, 0.3);
        cursor: pointer;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.08) 46%, rgba(255, 255, 255, 0) 62%),
          linear-gradient(150deg, #b2dbe8 0%, #8fc4d8 52%, #7db7cf 100%);
        box-shadow:
          0 16px 36px rgba(105, 160, 185, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.85),
          inset 0 -8px 18px rgba(85, 140, 165, 0.28);
        -webkit-backdrop-filter: blur(8px) saturate(1.3);
        backdrop-filter: blur(8px) saturate(1.3);
        transition: transform 160ms ease, box-shadow 160ms ease;
        -webkit-app-region: no-drag;
      }
      .loader-continue:hover {
        transform: translateY(-1px);
        box-shadow:
          0 20px 42px rgba(105, 160, 185, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          inset 0 -8px 18px rgba(85, 140, 165, 0.28);
      }
      .loader-continue:active {
        transform: translateY(0);
      }
      /* The returning-user headline and lead are long by design (they wrap to
         two lines in the mockup), so they opt out of the first-run nowrap. */
      #root-loader[data-variant="returning"] .loader-brandtag,
      #root-loader[data-variant="returning"] .loader-lead {
        white-space: normal;
      }
      #root-loader[data-variant="returning"] .loader-brandtag {
        align-items: flex-start;
        font-size: clamp(26px, 3.2vw, 34px);
      }
      #root-loader[data-variant="returning"] .loader-spinner {
        margin-top: 4px;
      }
      /* The progress cluster (track + phase) rides in the panel's own flow,
         directly under the subtitle — see the in-flow .loader-awaken above. An
         earlier build pinned it absolutely to the lower-left, which detached it
         from the panel and collided with the subtitle on wide windows; it now
         simply follows the copy. */
      .loader-status {
        color: #8b929d;
        font-size: 13px;
        letter-spacing: 0.01em;
        margin-bottom: 10px;
      }
      .loader-failure-details {
        position: absolute;
        left: 8%;
        bottom: 6%;
        z-index: 2;
        display: none;
        width: min(82vw, 560px);
        color: #7a828c;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        line-height: 1.6;
        text-align: left;
        white-space: pre-wrap;
      }
      /* The only way out of the failure screen. A dev-server module fetch that
         dies mid-boot (see __LUCA_TRY_BOOT_RECOVERY__ below) is usually fixed by
         one reload, but the module map only clears with a new document — so
         without this button the window is a dead end and the app has to be
         killed and relaunched. Hidden unless the loader actually failed. */
      .loader-recover {
        display: none;
        margin-top: 4px;
        padding: 9px 20px;
        border: 1px solid rgba(43, 48, 58, 0.16);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.7);
        color: #4b535f;
        font-family: inherit;
        font-size: 13px;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition:
          background 160ms ease,
          border-color 160ms ease;
      }
      .loader-recover:hover {
        background: rgba(255, 255, 255, 0.94);
        border-color: rgba(43, 48, 58, 0.28);
      }
      .loader-recover:focus-visible {
        outline: 2px solid rgba(127, 169, 216, 0.75);
        outline-offset: 2px;
      }
      .loader-progress {
        position: relative;
        width: 100%;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(43, 48, 58, 0.09);
      }
      .loader-progress::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #a6c6e8 0%, #cfe0f2 100%);
        box-shadow: 0 0 10px rgba(127, 169, 216, 0.5);
        transform-origin: left;
        transform: scaleX(var(--loader-progress, 0.2));
        transition: transform 520ms ease;
      }
      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Failed state: re-center everything, hide face/spinner/bar. */
      #root-loader[data-state="failed"] {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      #root-loader[data-state="failed"] .loader-presence,
      #root-loader[data-state="failed"] .loader-presence-inline,
      #root-loader[data-state="failed"] .loader-awaken,
      #root-loader[data-state="failed"] .loader-summary,
      #root-loader[data-state="failed"] .loader-spinner {
        display: none;
      }
      #root-loader[data-state="failed"] .loader-panel {
        position: static;
        transform: none;
        width: min(90vw, 560px);
        margin: 12vh auto 0;
        text-align: center;
      }
      #root-loader[data-state="failed"] .loader-brandtag {
        justify-content: center;
        font-size: clamp(22px, 5vw, 32px);
      }
      #root-loader[data-state="failed"] .loader-subtitle {
        display: none;
      }
      #root-loader[data-state="failed"] .loader-status {
        color: #5b636f;
        max-width: min(82vw, 560px);
        text-align: center;
      }
      #root-loader[data-state="failed"] .loader-phase {
        display: none;
      }
      #root-loader[data-state="failed"] .loader-failure-details {
        position: static;
        display: block;
      }
      #root-loader[data-state="failed"] .loader-recover {
        display: inline-block;
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-spinner {
          animation: none;
        }
      }
      /* ---- Responsive -----------------------------------------------------
         The side-by-side arrangement (face right, panel left) needs roughly
         1024px. The panel is min(46vw, 420px), so below ~913px it starts
         shrinking: the nowrap heading and lead overflow their box and the
         checklist titles wrap to three and four lines. That is the state a
         RESTORED (non-maximized) window lands in, which is how most people
         first meet this screen — not an edge case.

         Below 1024 the layout stacks: the face stops being a column and
         becomes ambient backdrop behind the panel, and the panel centers at
         full width. The failed state already used exactly this shape, so the
         narrow layout is the same idea applied to the normal path. */
      /* ── Stacked layout (narrow windows / the mobile mockup) ──────────────
         The two-column hero can't breathe below ~1024px, so the loader becomes
         a single centred column: heading → subtitle → CLEAR face → checklist →
         Continue, exactly as the phone mockup. The absolute right-hand face is
         retired here and the inline face (which lives between subtitle and
         checklist in the DOM) takes over, so the face and card never overlap. */
      @media (max-width: 1023px) {
        #root-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 24px 16px;
        }
        .loader-presence {
          display: none; /* the inline face carries the stacked layout */
        }
        /* Face first and BIG: it leads the stacked column, the wordmark and
           readiness copy fall beneath it. order:-1 lifts it above the brand row
           without moving it in the DOM (the ready/failed hooks still find it).
           Height tracks the viewport so the presence grows and shrinks with the
           window instead of snapping to a fixed icon size. */
        .loader-presence-inline {
          display: flex;
          order: -1;
          width: 100%;
          height: min(46vh, 440px);
          margin: 0 0 22px;
        }
        .loader-panel {
          position: static;
          transform: none;
          width: min(94vw, 460px);
          display: flex;
          flex-direction: column;
          z-index: 2;
        }
        /* nowrap is what pushed the title and lead outside the panel; with a
           narrower column they are allowed to wrap, and centre like the mockup. */
        .loader-brandtag,
        .loader-lead {
          white-space: normal;
          text-align: center;
        }
        .loader-brandtag {
          justify-content: center;
          font-size: clamp(24px, 5vw, 34px);
        }
        /* The progress track + phase centre under the copy in the stacked view. */
        .loader-awaken {
          text-align: center;
        }
        /* Ready summary centres too, and its names drop the tick offset. */
        .loader-ready-headline {
          justify-content: center;
        }
        .loader-ready-names {
          justify-content: center;
          padding-left: 0;
        }
      }

      @media (max-width: 640px) {
        .loader-panel {
          width: 100%;
        }
        .loader-presence-inline {
          height: min(44vh, 380px);
          margin: 0 0 18px;
        }
        .loader-check {
          gap: 11px;
          padding: 10px 11px;
        }
        /* Keep the spinner and tick — they carry the state — but drop the
           word beside them; at this width it competes with the row's title. */
        .loader-check-status span {
          display: none;
        }
        .loader-card-foot {
          font-size: 11px;
        }
      }

      /* Short windows (e.g. an 800×600 restored window): the big face + copy can
         exceed the viewport. Let the column scroll from the top rather than
         clip, and keep the face substantial — it stays viewport-proportional
         (min(40vh, …)) instead of collapsing to an icon, which is what the
         800×600 boot was doing. */
      @media (max-width: 1023px) and (max-height: 640px) {
        #root-loader {
          justify-content: flex-start;
          overflow-y: auto;
        }
        .loader-presence-inline {
          height: min(40vh, 300px);
          margin: 0 0 14px;
        }
      }
    </style>
  </head>

  <body>
    <div class="root-window-controls" aria-label="Window controls">
      <button class="root-window-control" type="button" aria-label="Minimize window" title="Minimize" data-root-window-action="minimize">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 8.5h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" />
        </svg>
      </button>
      <button class="root-window-control" type="button" aria-label="Maximize or restore window" title="Maximize" data-root-window-action="maximize">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none" />
        </svg>
      </button>
      <button class="root-window-control close" type="button" aria-label="Close window" title="Close" data-root-window-action="close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" />
        </svg>
      </button>
    </div>
    <div id="root-loader">
      <div class="loader-presence" aria-hidden="true">
        <img class="loader-hologram-face" src="/hologram.png" alt="" />
      </div>
      <div class="loader-panel">
        <div class="loader-brandtag">
          <svg class="loader-spinner" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="5" r="2.6" opacity="1" />
            <circle cx="30.6" cy="9.4" r="2.4" opacity="0.85" />
            <circle cx="35" cy="20" r="2.2" opacity="0.72" />
            <circle cx="30.6" cy="30.6" r="2" opacity="0.58" />
            <circle cx="20" cy="35" r="1.9" opacity="0.44" />
            <circle cx="9.4" cy="30.6" r="1.8" opacity="0.32" />
            <circle cx="5" cy="20" r="1.7" opacity="0.22" />
            <circle cx="9.4" cy="9.4" r="1.6" opacity="0.15" />
          </svg>
          <span class="loader-text">Starting LucaOS</span>
        </div>
        <p class="loader-lead loader-status">
          Performing readiness checks. This will only take a moment.
        </p>
        <!-- Inline face for the stacked (narrow / mobile) layout: it sits
             between the subtitle and the checklist, exactly as the mobile
             mockup does, and is hidden on wide windows where the absolute
             .loader-presence carries the face on the right instead. -->
        <div class="loader-presence-inline" aria-hidden="true">
          <img class="loader-hologram-face" src="/hologram.png" alt="" />
        </div>
        <!-- Loading: a hairline progress bar + one status line, borrowed from
             the native boot splash so the two boots read as one calm, continuous
             moment instead of two different-looking screens. -->
        <div class="loader-awaken" id="loader-awaken">
          <div class="loader-track"><div class="loader-fill" id="loader-fill"></div></div>
          <div class="loader-phase" id="loader-phase"></div>
        </div>
        <!-- Ready: a clean, light summary of what is now live — no frosted box.
             The loading state already carried the weight; arrival should feel
             light. (id kept as loader-checklist for the boot hooks.) -->
        <div class="loader-summary" id="loader-checklist"></div>
        <div id="loader-healthpill"></div>
        <button class="loader-recover" id="loader-recover" type="button">
          Reload LucaOS
        </button>
        <div class="loader-failure-details" aria-live="polite"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const isElectronRoute =
          new URLSearchParams(window.location.search).get("platform") ===
          "electron";
        // The preload bridge (window.luca / window.electron) is available before
        // this script runs, so detect Electron directly instead of relying only
        // on the ?platform=electron URL param — which Vite/HMR can drop, leaving
        // the loader without its window controls even though it IS Electron.
        const isElectronShell = !!(window.luca || window.electron);
        const isWindowsHost = navigator.userAgent.includes("Windows");
        if ((isElectronRoute || isElectronShell) && isWindowsHost) {
          document.documentElement.classList.add("luca-electron-win");
        }
        document.querySelectorAll("[data-root-window-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.rootWindowAction;
            if (!action) return;
            const lucaAction = window.luca && window.luca[action];
            if (typeof lucaAction === "function") {
              lucaAction();
              return;
            }
            window.electron?.ipcRenderer?.send?.(`window-${action}`);
          });
        });

        const debugEnabled =
          new URLSearchParams(window.location.search).get("bootDebug") === "1";
        // Readiness checklist — the four stages shown as the second boot.
        // Each row advances pending -> resolving -> done as boot progress
        // climbs. `at` is the progress fraction by which the row is complete.
        // Shared line-icons so both first-run and returning sets look alike.
        const ICON_PROFILE =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6" stroke-linecap="round"/></svg>';
        const ICON_MEMORY =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4.5" width="16" height="15" rx="2.2"/><path d="M4 9.5h16M9 4.5v15" stroke-linecap="round"/></svg>';
        const ICON_TOOLS =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3.5l7 2.6v5.2c0 4.3-2.9 7.4-7 8.7-4.1-1.3-7-4.4-7-8.7V6.1l7-2.6z" stroke-linejoin="round"/></svg>';
        const ICON_VOICE =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 10v4M9 6.5v11M13 8.5v7M17 5.5v13M21 10v4"/></svg>';
        const ICON_SLIDERS =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/></svg>';
        const ICON_LOCK =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4.5" y="10" width="15" height="10" rx="2.4"/><path d="M8 10V7.5a4 4 0 018 0V10" stroke-linecap="round"/></svg>';
        const ICON_SPARK =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 4v16M4 12h16M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7"/></svg>';

        // A returning user (setup already complete) sees a "welcome back"
        // resume sequence; a fresh install sees the first-run setup checks.
        // The flag is written by settingsService once onboarding finishes.
        const isReturningUser =
          typeof localStorage !== "undefined" &&
          localStorage.getItem("LUCA_SETUP_COMPLETE") === "true";

        const readinessCopy = isReturningUser
          ? {
              // Returning user: the environment is already theirs, so Luca is
              // "preparing" it rather than setting it up (founder mockup).
              title: "Preparing your LucaOS environment",
              lead:
                "Almost ready. Luca is preparing everything for a safe and seamless experience.",
              footer: "details",
              healthPill: "System is healthy and up to date",
              checks: [
                {
                  title: "Checking your preferences",
                  detail: "Personalizing your experience",
                  at: 0.32,
                  icon: ICON_SLIDERS,
                },
                {
                  title: "Restoring memory boundaries",
                  detail: "Securing your context",
                  at: 0.54,
                  icon: ICON_TOOLS,
                },
                {
                  title: "Preparing safe tool access",
                  detail: "Enabling trusted tools and services",
                  at: 0.76,
                  icon: ICON_LOCK,
                },
                {
                  title: "Ready to continue",
                  detail: "Handoff to your Luca experience",
                  at: 0.94,
                  icon: ICON_SPARK,
                },
              ],
            }
          : {
              title: "Starting LucaOS",
              lead: "Performing readiness checks. This will only take a moment.",
              footer: "integrity",
              checks: [
                {
                  title: "Checking your preferences",
                  detail: "Resolving your profile and settings",
                  at: 0.32,
                  icon: ICON_PROFILE,
                },
                {
                  title: "Restoring memory boundaries",
                  detail: "Mapping secure memory layers",
                  at: 0.54,
                  icon: ICON_MEMORY,
                },
                {
                  title: "Preparing safe tool access",
                  detail: "Verifying permissions and sandbox",
                  at: 0.76,
                  icon: ICON_TOOLS,
                },
                {
                  title: "Aligning voice and presence",
                  detail: "Calibrating voice model and tone",
                  at: 0.94,
                  icon: ICON_VOICE,
                },
              ],
            };

        const readinessChecks = readinessCopy.checks;

        // Apply the matching title + lead before first paint (this inline
        // script runs before the browser paints, so there's no flash).
        {
          const rootEl = document.getElementById("root-loader");
          if (rootEl) {
            rootEl.dataset.variant = isReturningUser ? "returning" : "first-run";
          }
          const brandTextEl = document.querySelector(
            ".loader-brandtag .loader-text",
          );
          if (brandTextEl) brandTextEl.textContent = readinessCopy.title;
          const leadEl = document.querySelector(".loader-lead");
          if (leadEl) leadEl.textContent = readinessCopy.lead;
        }

        const CHECK_TICK =
          '<svg class="loader-check-tick" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.3 4.3L19 7.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const CHECK_SPIN =
          '<svg class="loader-mini-spin" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="5" r="2.6" opacity="1"/><circle cx="30.6" cy="9.4" r="2.4" opacity="0.85"/><circle cx="35" cy="20" r="2.2" opacity="0.72"/><circle cx="30.6" cy="30.6" r="2" opacity="0.58"/><circle cx="20" cy="35" r="1.9" opacity="0.44"/><circle cx="9.4" cy="30.6" r="1.8" opacity="0.32"/><circle cx="5" cy="20" r="1.7" opacity="0.22"/><circle cx="9.4" cy="9.4" r="1.6" opacity="0.15"/></svg>';

        let readinessProgress = 0.18;
        let readinessStatusTimer = 0;

        // Loading: advance the hairline bar and name the current check on one
        // status line — the native splash's calm, no per-row card. The phase
        // is derived from progress against each check's `at` threshold, so the
        // words stay in step with the bar.
        const paintProgress = () => {
          const fill = document.getElementById("loader-fill");
          const phase = document.getElementById("loader-phase");
          if (fill) fill.style.width = Math.round(readinessProgress * 100) + "%";
          if (phase) {
            const active =
              readinessChecks.find((c) => readinessProgress < c.at) ||
              readinessChecks[readinessChecks.length - 1];
            if (active && phase.textContent !== active.title) {
              phase.textContent = active.title;
            }
          }
        };

        // React's boot entry pings progress through this hook; real progress
        // always wins because we only ever advance (take the max).
        window.__LUCA_SET_BOOT_STATUS__ = (text, progress) => {
          const loader = document.getElementById("root-loader");
          if (!loader || loader.dataset.state === "failed") return;
          if (loader.dataset.state === "ready") return;
          if (typeof progress === "number") {
            readinessProgress = Math.max(
              readinessProgress,
              Math.min(progress, 1),
            );
          }
          paintProgress();
        };

        // ---- Ready gate -----------------------------------------------------
        // FIRST RUN ONLY. Once React has mounted, the checks resolve into
        // "LucaOS is ready." — a settled summary of what's now live — and wait
        // for the user to press Continue before handing over the screen.
        //
        // A RETURNING user never sees this. Their environment is already theirs,
        // so a manual Continue on every launch and every refresh is friction
        // wearing the costume of ceremony: it turns a reload into a click. They
        // get the same readiness checks, then the loader simply fades away.
        // [full name, status value, short chip label]. All five resolve green
        // at ready, so the summary collapses to one "All systems ready" line
        // with the short names beneath — the per-service status rides in each
        // name's hover title, so nothing is lost, only the height.
        const READY_SUMMARY = [
          ["Core services", "Online", "Core"],
          ["Memory systems", "Synchronized", "Memory"],
          ["Models & tools", "Loaded", "Models"],
          ["Personal context", "Ready", "Context"],
          ["Security & privacy", "Active", "Security"],
        ];

        // Fade the loader out and take its window controls with it (React
        // renders its own once mounted, so leaving these would double them up).
        const dismissLoader = (loader) => {
          loader.style.opacity = "0";
          window.setTimeout(() => {
            loader.remove();
            document.querySelector(".root-window-controls")?.remove();
          }, 520);
        };

        window.__LUCA_BOOT_LOADER_HANDOFF__ = () => {
          const loader = document.getElementById("root-loader");
          if (!loader || loader.dataset.state === "failed") return false;
          window.__LUCA_CLEAR_BOOT_STATUS_LOOP__?.();
          loader.dataset.state = "ready";

          // Returning user: straight into the workspace, no click. Returning
          // true still tells the caller we own the dismissal, so it must not
          // rip the loader out from under the fade.
          if (isReturningUser) {
            dismissLoader(loader);
            return true;
          }

          const brandTextEl = loader.querySelector(
            ".loader-brandtag .loader-text",
          );
          if (brandTextEl) brandTextEl.textContent = "LucaOS is ready.";
          const leadEl = loader.querySelector(".loader-lead");
          if (leadEl)
            leadEl.textContent = "Your AI environment is online and aware.";

          const host = document.getElementById("loader-checklist");
          if (host) {
            // One calm line — everything's green, so the honest signal is
            // "ready" — with the five services named beneath (hover each for its
            // status). Replaces the five full-width rows that only added height.
            const names = READY_SUMMARY.map(
              (item) => `<span title="${item[0]} — ${item[1]}">${item[2]}</span>`,
            ).join('<i aria-hidden="true">·</i>');
            host.innerHTML =
              '<div class="loader-ready-headline">' +
              CHECK_TICK +
              "<span>All systems ready</span></div>" +
              `<div class="loader-ready-names">${names}</div>`;
          }
          // No manual gate: hold the "ready" confirmation for one calm beat so
          // it registers, then fade straight into the workspace — the same
          // hands-off handoff returning users already get, no Continue click.
          window.setTimeout(() => dismissLoader(loader), 1000);
          return true;
        };

        window.__LUCA_CLEAR_BOOT_STATUS_LOOP__ = () => {
          if (readinessStatusTimer) {
            window.clearInterval(readinessStatusTimer);
            readinessStatusTimer = 0;
          }
        };

        paintProgress();
        // Gentle auto-advance so the bar visibly climbs even before the real
        // boot pings arrive; capped just under complete until the app opens.
        readinessStatusTimer = window.setInterval(() => {
          const loader = document.getElementById("root-loader");
          if (!loader || loader.dataset.state === "failed") {
            window.__LUCA_CLEAR_BOOT_STATUS_LOOP__();
            return;
          }
          readinessProgress = Math.min(readinessProgress + 0.12, 0.9);
          paintProgress();
        }, 900);

        // ---- Transient boot-failure recovery -------------------------------
        //
        // THE FAILURE: in dev, Vite serves the renderer as ~1,900 separate ES
        // modules over HTTP from 127.0.0.1. When Chromium's network service sees
        // a network change -- Wi-Fi flip, VPN up/down, a virtual adapter
        // appearing, sleep/wake -- it tears down every socket it owns, loopback
        // included, and fails the requests in flight with ERR_NETWORK_CHANGED.
        // A single one of those ~1,900 fetches failing rejects the dynamic
        // `import()` of the app entry, and the app "failed to start" even though
        // nothing is wrong with it. Packaged builds load from file:// and cannot
        // hit this; the dev loop hits it regularly, which is where the app is
        // actually used day to day.
        //
        // WHY THE FIX IS A RELOAD AND NOT A RETRY: per the HTML spec a module
        // whose fetch failed is recorded in the document's module map as failed,
        // and re-importing that URL returns the same failure without going back
        // to the network. The requests that die are the entry's *dependencies*,
        // whose URLs are baked into the served entry text -- so even re-importing
        // the entry with a fresh query string re-resolves the same poisoned URLs.
        // The module map is per-document, so only a new document clears it.
        //
        // WHY IT IS BOUNDED: a syntax error or a throw in app code fails
        // identically on every reload. Auto-reloading that would replace a dead
        // end with an infinite flicker loop, which is worse. So only transport
        // failures qualify, the budget is small, and it lives in sessionStorage
        // -- which survives the reload but dies with the window, so a fresh
        // launch always starts with the full budget rather than staying poisoned.
        const BOOT_RETRY_KEY = "LUCA_BOOT_RECOVERY_ATTEMPTS";
        const BOOT_RETRY_LIMIT = 3;
        // Let the network settle before trying again; an instant reload tends to
        // land on the same torn-down sockets.
        const BOOT_RETRY_BACKOFF_MS = [400, 1200, 2500];
        // Transport interrupted mid-flight. The distinction that matters is
        // "the socket was yanked" (a reload can fix it) versus "nothing is
        // listening" -- ERR_CONNECTION_REFUSED is deliberately NOT here: the
        // core server and Cortex are routinely not up yet during boot, the app
        // is designed to start without them, and reloading cannot conjure a
        // listener. Retry what was interrupted, never what was refused.
        const MODULE_LOAD_FAILURES = [
          "Failed to fetch dynamically imported module",
          "error loading dynamically imported module",
          "Importing a module script failed",
          "NetworkError",
          "Load failed",
        ];
        // Only ever supporting evidence -- see the note in the recovery hook.
        const INTERRUPTED_TRANSPORT_CODES = [
          "ERR_NETWORK_CHANGED",
          "ERR_NETWORK_IO_SUSPENDED",
          "ERR_CONNECTION_RESET",
          "ERR_CONNECTION_CLOSED",
          "ERR_CONNECTION_ABORTED",
          "ERR_EMPTY_RESPONSE",
        ];

        const readBootRetryCount = () => {
          try {
            return Number(window.sessionStorage.getItem(BOOT_RETRY_KEY)) || 0;
          } catch {
            // Private mode / storage disabled. Report the budget as spent rather
            // than reloading forever with no way to count.
            return BOOT_RETRY_LIMIT;
          }
        };

        window.__LUCA_CLEAR_BOOT_RECOVERY__ = () => {
          try {
            window.sessionStorage.removeItem(BOOT_RETRY_KEY);
          } catch {
            /* nothing to clear if storage is unavailable */
          }
        };

        // Returns true when it has taken ownership of the failure (a reload is
        // scheduled), so the caller must NOT paint the failure screen.
        window.__LUCA_TRY_BOOT_RECOVERY__ = (error) => {
          if (window.__LUCA_REACT_MOUNTED__ === true) return false;
          // Two callers can report the same failure: the entry's own catch, and
          // the 5s sweeper below that reads __LUCA_REACT_BOOTSTRAP_ERROR__. With
          // today's sub-5s backoff the navigation always wins the race, but a
          // longer backoff would silently spend two attempts on one failure.
          if (window.__LUCA_BOOT_RECOVERY_SCHEDULED__ === true) return true;

          const description =
            error instanceof Error
              ? `${error.name}: ${error.message}`
              : error
                ? String(error)
                : "";

          // The PRIMARY signal must be the module load itself failing. Chromium
          // reports the per-request ERR_* code only to the console, so the
          // captured-error list is consulted as backup -- but only when we have
          // no description of our own. Widening the primary test to include
          // whatever the listeners happened to capture would let unrelated
          // network noise (a backend fetch failing while core is still starting)
          // make a genuine app-code error look transient, and we would reload
          // three times over a real bug before showing it.
          const isModuleLoadFailure = MODULE_LOAD_FAILURES.some((signature) =>
            description.includes(signature),
          );
          const capturedOnly = [
            window.__LUCA_BOOT_ERROR__ || "",
            (window.__LUCA_CAPTURED_BOOT_ERRORS__ || []).join(" | "),
          ].join(" | ");
          const isInterruptedTransport =
            !description &&
            INTERRUPTED_TRANSPORT_CODES.some((code) =>
              capturedOnly.includes(code),
            );
          if (!isModuleLoadFailure && !isInterruptedTransport) return false;

          const attempts = readBootRetryCount();
          if (attempts >= BOOT_RETRY_LIMIT) return false;

          try {
            window.sessionStorage.setItem(BOOT_RETRY_KEY, String(attempts + 1));
          } catch {
            return false;
          }

          const delay =
            BOOT_RETRY_BACKOFF_MS[attempts] ??
            BOOT_RETRY_BACKOFF_MS[BOOT_RETRY_BACKOFF_MS.length - 1];
          console.warn(
            `[LucaOS boot] transient load failure, reloading (${attempts + 1}/${BOOT_RETRY_LIMIT}) in ${delay}ms:`,
            description || "(no message)",
          );
          const status = document.getElementById("root-loader")?.querySelector(
            ".loader-status",
          );
          if (status) {
            status.textContent = "Connection interrupted — reconnecting…";
          }
          window.__LUCA_BOOT_RECOVERY_SCHEDULED__ = true;
          window.setTimeout(() => window.location.reload(), delay);
          return true;
        };

        document
          .getElementById("loader-recover")
          ?.addEventListener("click", () => {
            // An explicit click is the user overriding the budget, so clear it:
            // whatever they fixed in the meantime deserves a full set of
            // automatic retries again.
            window.__LUCA_CLEAR_BOOT_RECOVERY__();
            window.location.reload();
          });

        window.__LUCA_SHOW_BOOT_FAILURE__ = (message, error) => {
          const loader = document.getElementById("root-loader");
          if (!loader || window.__LUCA_REACT_MOUNTED__ === true) return;
          // Self-heal first. Painting the failure screen is the last resort,
          // reached only when the error is not a transport blip or the retry
          // budget for this window is spent.
          if (window.__LUCA_TRY_BOOT_RECOVERY__(error)) return;
          window.__LUCA_CLEAR_BOOT_STATUS_LOOP__?.();

          const mainScript = document.querySelector(
            'script[type="module"][src]',
          );
          const errorMessage =
            error instanceof Error ? error.message : error ? String(error) : "";
          if (errorMessage) window.__LUCA_BOOT_ERROR__ = errorMessage;
          loader.dataset.state = "failed";

          const title = loader.querySelector(".loader-text");
          const status = loader.querySelector(".loader-status");
          const details = loader.querySelector(".loader-failure-details");
          const awaken = loader.querySelector("#loader-awaken");
          if (awaken) awaken.style.display = "none";
          if (title)
            title.textContent = message || "LucaOS web app failed to start";
          if (status) {
            status.textContent =
              message === "LucaOS failed before app mount"
                ? "Open console for startup error"
                : "React did not hydrate. Check browser console or deployment bundle.";
          }

          const diagnostics = [
            `Hostname: ${window.location.hostname || "(none)"}`,
            `Path: ${window.location.pathname}${window.location.search}`,
            `Main script tag: ${mainScript ? "present" : "missing"}`,
            // Say so when the automatic recovery above already tried and gave
            // up, otherwise this screen looks like a first failure and the
            // reloads it did are invisible.
            `Automatic reloads used: ${readBootRetryCount()}/${BOOT_RETRY_LIMIT}`,
          ];
          if (debugEnabled) {
            diagnostics.push(
              `React entry loaded: ${window.__LUCA_REACT_ENTRY_LOADED__ === true}`,
              `React mount attempted: ${window.__LUCA_REACT_MOUNT_ATTEMPTED__ === true}`,
              `React mounted: ${window.__LUCA_REACT_MOUNTED__ === true}`,
              `Bootstrap error: ${window.__LUCA_REACT_BOOTSTRAP_ERROR__ || "(none)"}`,
              `Captured errors/rejections: ${
                window.__LUCA_CAPTURED_BOOT_ERRORS__?.join(" | ") || "(none)"
              }`,
              `Script count: ${document.scripts.length}`,
            );
          }
          if (details) details.textContent = diagnostics.join("\n");
        };

        const captureBootError = (error) => {
          const description =
            error instanceof Error
              ? `${error.name}: ${error.message}`
              : String(error);
          window.__LUCA_BOOT_ERROR__ = description;
          window.__LUCA_CAPTURED_BOOT_ERRORS__ ??= [];
          window.__LUCA_CAPTURED_BOOT_ERRORS__.push(description);
        };

        if (!window.__LUCA_BOOT_ERROR_LISTENERS_REGISTERED__) {
          window.__LUCA_BOOT_ERROR_LISTENERS_REGISTERED__ = true;
          window.addEventListener("error", (event) => {
            if (window.__LUCA_REACT_MOUNTED__ !== true) {
              captureBootError(
                event.error || event.message || "Unknown startup error",
              );
            }
          });
          window.addEventListener("unhandledrejection", (event) => {
            if (window.__LUCA_REACT_MOUNTED__ !== true) {
              captureBootError(event.reason || "Unhandled startup rejection");
            }
          });
        }

        window.addEventListener("luca-react-bootstrap-error", () => {
          window.__LUCA_SHOW_BOOT_FAILURE__(
            "LucaOS web app failed to start",
            window.__LUCA_REACT_BOOTSTRAP_ERROR__,
          );
        });

        window.setTimeout(() => {
          if (
            window.__LUCA_REACT_MOUNTED__ !== true &&
            (window.__LUCA_REACT_BOOTSTRAP_ERROR__ ||
              window.__LUCA_BOOT_ERROR__)
          ) {
            window.__LUCA_SHOW_BOOT_FAILURE__(
              "LucaOS web app failed to start",
              window.__LUCA_REACT_BOOTSTRAP_ERROR__ ||
                window.__LUCA_BOOT_ERROR__,
            );
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
