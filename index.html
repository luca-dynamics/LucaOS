    <link

    />
    <!-- Favicons with light/dark mode support -->

      rel="icon"
      type="image/png"
      href="/icon.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/icon_dark.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!-- Fallback -->
    <link rel="apple-touch-icon" href="/icon.png" />
    <style>
      /* CRITICAL: TRANSPARENT BACKGROUND FOR ELECTRON OVERLAY */
      html,
      body {
        background-color: transparent;
        margin: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      /* Custom Scrollbar for Terminal */
      ::-webkit-scrollbar {
        width: 4px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.5);
      }

      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 0px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #ef4444;
      }

      /* Electron Draggable Region */
      .app-region-drag {
        -webkit-app-region: drag;
      }

      .app-region-no-drag {
        -webkit-app-region: no-drag;
      }

      /* 2050 Upgrade: Volumetric UI Effects */
      .transform-gpu {
        transform: translateZ(0);
        will-change: transform;
      }

      @keyframes shimmer {
        0% {
          background-position: -200% 0;
        }

        100% {
          background-position: 200% 0;
        }
      }
    </style>
    <!-- Import Map Removed for Local Vite Stability -->

    <link rel="stylesheet" href="/src/index.css" />
    <style>
      #root-loader {
        position: fixed;
        inset: 0;
        /* Ice-blue glacier environment matched to the hologram's palette,
           same as the native boot splash (boot.html): luminous glow behind
           the face, soft light upper-left, cool base deepening at the edges.
           Pieces are positioned absolutely below; failed state re-centers. */
        background:
          radial-gradient(55% 70% at 72% 42%, rgba(238, 249, 251, 0.92) 0%, rgba(238, 249, 251, 0) 60%),
          radial-gradient(80% 100% at 18% 28%, rgba(243, 250, 252, 0.7) 0%, rgba(243, 250, 252, 0) 55%),
          linear-gradient(160deg, #e2edf2 0%, #d8e4ec 48%, #c9d9e3 100%);
        display: block;
        z-index: 9999;
        font-family: "Segoe UI Variable Display", Inter, "Segoe UI", system-ui, sans-serif;
        color: #2b303a;
        transition: opacity 0.5s ease-out;
        overflow: hidden;
        -webkit-app-region: drag;
      }
      .root-window-controls {
        position: fixed;
        top: 2px;
        right: 2px;
        z-index: 10000;
        display: none;
        align-items: center;
        gap: 2px;
        -webkit-app-region: no-drag;
      }
      html.luca-electron-win .root-window-controls {
        display: flex;
      }
      .root-window-control {
        width: 30px;
        height: 26px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #5b636f;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        cursor: pointer;
        transition: color 160ms ease, background 160ms ease;
      }
      .root-window-control:hover {
        color: #2b303a;
        background: rgba(43, 48, 58, 0.06);
      }
      .root-window-control.close:hover {
        color: #d5504a;
        background: rgba(213, 80, 74, 0.1);
      }
      /* Face: large, center-right. */
      .loader-presence {
        position: absolute;
        right: 6%;
        top: 50%;
        transform: translateY(-50%);
        width: auto;
        height: min(86vh, 640px);
        max-width: 52vw;
        display: grid;
        place-items: center;
        z-index: 1;
      }
      .loader-hologram-face {
        position: relative;
        z-index: 1;
        width: auto;
        height: 100%;
        max-width: 100%;
        object-fit: contain;
        /* High-key blend: lightened + desaturated into the pale environment,
           with the neck/shoulders dissolving through a bottom gradient mask. */
        opacity: 0.82;
        filter: brightness(1.32) saturate(0.62) contrast(0.94)
          drop-shadow(0 24px 70px rgba(120, 160, 205, 0.22));
        -webkit-mask-image: linear-gradient(to bottom, black 55%, rgba(0, 0, 0, 0.55) 76%, transparent 95%);
        mask-image: linear-gradient(to bottom, black 55%, rgba(0, 0, 0, 0.55) 76%, transparent 95%);
      }
      /* Brand: spinner + wordmark + subtitle, center-left. */
      .loader-brand {
        position: absolute;
        left: 8%;
        top: 46%;
        transform: translateY(-50%);
        z-index: 2;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
      }
      /* Spinner + wordmark share one row (spinner centered on the LucaOS
         line); the subtitle sits centered on the line below. */
      .loader-brand-line {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .loader-spinner {
        width: 34px;
        height: 34px;
        flex: none;
        animation: loader-spin 1.5s linear infinite;
      }
      .loader-spinner circle {
        fill: #8b929d;
      }
      .loader-text {
        position: relative;
        z-index: 1;
        font-family:
          "Segoe UI Variable Display",
          Inter,
          "Segoe UI",
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        font-size: clamp(30px, min(6vw, 6dvh), 48px);
        letter-spacing: -0.025em;
        font-weight: 600;
        line-height: 1;
        color: #2b303a;
      }
      .loader-subtitle {
        margin-top: 8px;
        text-align: center;
        font-size: 15px;
        letter-spacing: 0.01em;
        font-weight: 500;
        color: #5b636f;
      }
      /* Awaken cluster: status label + progress bar + phase, lower-left. */
      .loader-awaken {
        position: absolute;
        left: 8%;
        bottom: 15%;
        width: min(38vw, 340px);
        z-index: 2;
      }
      .loader-status {
        color: #8b929d;
        font-size: 13px;
        letter-spacing: 0.01em;
        margin-bottom: 10px;
      }
      .loader-phase {
        min-height: 14px;
        color: #8b929d;
        font-size: 11px;
        letter-spacing: 0.01em;
        margin-top: 8px;
      }
      .loader-failure-details {
        position: absolute;
        left: 8%;
        bottom: 6%;
        z-index: 2;
        display: none;
        width: min(82vw, 560px);
        color: #7a828c;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        line-height: 1.6;
        text-align: left;
        white-space: pre-wrap;
      }
      .loader-progress {
        position: relative;
        width: 100%;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(43, 48, 58, 0.09);
      }
      .loader-progress::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #a6c6e8 0%, #cfe0f2 100%);
        box-shadow: 0 0 10px rgba(127, 169, 216, 0.5);
        transform-origin: left;
        transform: scaleX(var(--loader-progress, 0.2));
        transition: transform 520ms ease;
      }
      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Failed state: re-center everything, hide face/spinner/bar. */
      #root-loader[data-state="failed"] {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      #root-loader[data-state="failed"] .loader-presence,
      #root-loader[data-state="failed"] .loader-progress,
      #root-loader[data-state="failed"] .loader-spinner {
        display: none;
      }
      #root-loader[data-state="failed"] .loader-brand,
      #root-loader[data-state="failed"] .loader-awaken {
        position: static;
        transform: none;
        width: auto;
        text-align: center;
      }
      #root-loader[data-state="failed"] .loader-text {
        font-size: clamp(24px, 7vw, 38px);
        text-align: center;
      }
      #root-loader[data-state="failed"] .loader-subtitle {
        display: none;
      }
      #root-loader[data-state="failed"] .loader-status {
        color: #5b636f;
        max-width: min(82vw, 560px);
        text-align: center;
      }
      #root-loader[data-state="failed"] .loader-phase {
        display: none;
      }
      #root-loader[data-state="failed"] .loader-failure-details {
        position: static;
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-spinner {
          animation: none;
        }
      }
      @media (max-width: 640px) {
        .loader-presence {
          position: static;
          height: 52vh;
          max-width: 84vw;
          margin: 2vh auto 0;
          transform: none;
        }
        .loader-brand {
          position: static;
          transform: none;
          display: flex;
          width: fit-content;
          margin: 3.5vh auto 0;
        }
        .loader-text {
          font-size: 32px;
          text-align: center;
        }
        .loader-awaken {
          left: 50%;
          transform: translateX(-50%);
          bottom: 8%;
          width: 74vw;
          text-align: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="root-window-controls" aria-label="Window controls">
      <button class="root-window-control" type="button" aria-label="Minimize window" title="Minimize" data-root-window-action="minimize">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 8.5h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" />
        </svg>
      </button>
      <button class="root-window-control" type="button" aria-label="Maximize or restore window" title="Maximize" data-root-window-action="maximize">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none" />
        </svg>
      </button>
      <button class="root-window-control close" type="button" aria-label="Close window" title="Close" data-root-window-action="close">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" />
        </svg>
      </button>
    </div>
    <div id="root-loader">
      <div class="loader-presence" aria-hidden="true">
        <img class="loader-hologram-face" src="/hologram.png" alt="" />
      </div>
      <div class="loader-brand">
        <div class="loader-brand-line">
          <svg class="loader-spinner" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="5" r="2.6" opacity="1" />
            <circle cx="30.6" cy="9.4" r="2.4" opacity="0.85" />
            <circle cx="35" cy="20" r="2.2" opacity="0.72" />
            <circle cx="30.6" cy="30.6" r="2" opacity="0.58" />
            <circle cx="20" cy="35" r="1.9" opacity="0.44" />
            <circle cx="9.4" cy="30.6" r="1.8" opacity="0.32" />
            <circle cx="5" cy="20" r="1.7" opacity="0.22" />
            <circle cx="9.4" cy="9.4" r="1.6" opacity="0.15" />
          </svg>
          <div class="loader-text">LucaOS</div>
        </div>
        <div class="loader-subtitle">Host-native personal AI OS</div>
      </div>
      <div class="loader-awaken">
        <div class="loader-status">Awakening Luca…</div>
        <div class="loader-progress" aria-hidden="true"></div>
        <div class="loader-phase">Preparing the app</div>
      </div>
      <div class="loader-failure-details" aria-live="polite"></div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const isElectronRoute =
          new URLSearchParams(window.location.search).get("platform") ===
          "electron";
        // The preload bridge (window.luca / window.electron) is available before
        // this script runs, so detect Electron directly instead of relying only
        // on the ?platform=electron URL param — which Vite/HMR can drop, leaving
        // the loader without its window controls even though it IS Electron.
        const isElectronShell = !!(window.luca || window.electron);
        const isWindowsHost = navigator.userAgent.includes("Windows");
        if ((isElectronRoute || isElectronShell) && isWindowsHost) {
          document.documentElement.classList.add("luca-electron-win");
        }
        document.querySelectorAll("[data-root-window-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.rootWindowAction;
            if (!action) return;
            const lucaAction = window.luca && window.luca[action];
            if (typeof lucaAction === "function") {
              lucaAction();
              return;
            }
            window.electron?.ipcRenderer?.send?.(`window-${action}`);
          });
        });

        const debugEnabled =
          new URLSearchParams(window.location.search).get("bootDebug") === "1";
        const readinessStatuses = [
          {
            text: "Starting LucaOS",
            detail: "Preparing the app",
            progress: 0.2,
          },
          {
            text: "Checking your preferences",
            detail: "Loading saved setup",
            progress: 0.38,
          },
          {
            text: "Preparing memory boundaries",
            detail: "Checking local memory",
            progress: 0.56,
          },
          {
            text: "Preparing safe tool access",
            detail: "Preparing tools",
            progress: 0.74,
          },
          {
            text: "Opening LucaOS",
            detail: "Loading your workspace",
            progress: 0.92,
          },
          {
            text: "Opening LucaOS",
            detail: "Finishing app setup",
            progress: 0.96,
          },
        ];
        let readinessStatusIndex = 0;
        let readinessStatusTimer = 0;

        window.__LUCA_SET_BOOT_STATUS__ = (text, progress, detail) => {
          const loader = document.getElementById("root-loader");
          if (!loader || loader.dataset.state === "failed") return;

          const status = loader.querySelector(".loader-status");
          const phase = loader.querySelector(".loader-phase");
          if (status && text) status.textContent = text;
          if (phase && detail) phase.textContent = detail;
          if (typeof progress === "number") {
            const nextProgress = Math.max(0.08, Math.min(progress, 1));
            loader.style.setProperty("--loader-progress", String(nextProgress));
          }
        };

        window.__LUCA_CLEAR_BOOT_STATUS_LOOP__ = () => {
          if (readinessStatusTimer) {
            window.clearInterval(readinessStatusTimer);
            readinessStatusTimer = 0;
          }
        };

        window.__LUCA_SET_BOOT_STATUS__(
          readinessStatuses[0].text,
          readinessStatuses[0].progress,
          readinessStatuses[0].detail,
        );
        readinessStatusTimer = window.setInterval(() => {
          const loader = document.getElementById("root-loader");
          if (!loader || loader.dataset.state === "failed") {
            window.__LUCA_CLEAR_BOOT_STATUS_LOOP__();
            return;
          }

          readinessStatusIndex = Math.min(
            readinessStatusIndex + 1,
            readinessStatuses.length - 1,
          );
          const nextStatus = readinessStatuses[readinessStatusIndex];
          window.__LUCA_SET_BOOT_STATUS__(
            nextStatus.text,
            nextStatus.progress,
            nextStatus.detail,
          );
        }, 1100);

        window.__LUCA_SHOW_BOOT_FAILURE__ = (message, error) => {
          const loader = document.getElementById("root-loader");
          if (!loader || window.__LUCA_REACT_MOUNTED__ === true) return;
          window.__LUCA_CLEAR_BOOT_STATUS_LOOP__?.();

          const mainScript = document.querySelector(
            'script[type="module"][src]',
          );
          const errorMessage =
            error instanceof Error ? error.message : error ? String(error) : "";
          if (errorMessage) window.__LUCA_BOOT_ERROR__ = errorMessage;
          loader.dataset.state = "failed";

          const title = loader.querySelector(".loader-text");
          const status = loader.querySelector(".loader-status");
          const details = loader.querySelector(".loader-failure-details");
          if (title)
            title.textContent = message || "LucaOS web app failed to start";
          if (status) {
            status.textContent =
              message === "LucaOS failed before app mount"
                ? "Open console for startup error"
                : "React did not hydrate. Check browser console or deployment bundle.";
          }

          const diagnostics = [
            `Hostname: ${window.location.hostname || "(none)"}`,
            `Path: ${window.location.pathname}${window.location.search}`,
            `Main script tag: ${mainScript ? "present" : "missing"}`,
          ];
          if (debugEnabled) {
            diagnostics.push(
              `React entry loaded: ${window.__LUCA_REACT_ENTRY_LOADED__ === true}`,
              `React mount attempted: ${window.__LUCA_REACT_MOUNT_ATTEMPTED__ === true}`,
              `React mounted: ${window.__LUCA_REACT_MOUNTED__ === true}`,
              `Bootstrap error: ${window.__LUCA_REACT_BOOTSTRAP_ERROR__ || "(none)"}`,
              `Captured errors/rejections: ${
                window.__LUCA_CAPTURED_BOOT_ERRORS__?.join(" | ") || "(none)"
              }`,
              `Script count: ${document.scripts.length}`,
            );
          }
          if (details) details.textContent = diagnostics.join("\n");
        };

        const captureBootError = (error) => {
          const description =
            error instanceof Error
              ? `${error.name}: ${error.message}`
              : String(error);
          window.__LUCA_BOOT_ERROR__ = description;
          window.__LUCA_CAPTURED_BOOT_ERRORS__ ??= [];
          window.__LUCA_CAPTURED_BOOT_ERRORS__.push(description);
        };

        if (!window.__LUCA_BOOT_ERROR_LISTENERS_REGISTERED__) {
          window.__LUCA_BOOT_ERROR_LISTENERS_REGISTERED__ = true;
          window.addEventListener("error", (event) => {
            if (window.__LUCA_REACT_MOUNTED__ !== true) {
              captureBootError(
                event.error || event.message || "Unknown startup error",
              );
            }
          });
          window.addEventListener("unhandledrejection", (event) => {
            if (window.__LUCA_REACT_MOUNTED__ !== true) {
              captureBootError(event.reason || "Unhandled startup rejection");
            }
          });
        }

        window.addEventListener("luca-react-bootstrap-error", () => {
          window.__LUCA_SHOW_BOOT_FAILURE__(
            "LucaOS web app failed to start",
            window.__LUCA_REACT_BOOTSTRAP_ERROR__,
          );
        });

        window.setTimeout(() => {
          if (
            window.__LUCA_REACT_MOUNTED__ !== true &&
            (window.__LUCA_REACT_BOOTSTRAP_ERROR__ ||
              window.__LUCA_BOOT_ERROR__)
          ) {
            window.__LUCA_SHOW_BOOT_FAILURE__(
              "LucaOS web app failed to start",
              window.__LUCA_REACT_BOOTSTRAP_ERROR__ ||
                window.__LUCA_BOOT_ERROR__,
            );
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
