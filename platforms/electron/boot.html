<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        :root {
            --accent: #7ca8ff;
            --ink: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.5);
            --faint: rgba(255, 255, 255, 0.34);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #0b0c0e;
            color: var(--ink);
            font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Edge-light: Luca incarnating into this host body. */
        .edge {
            position: fixed;
            inset: 0;
            pointer-events: none;
            border: 1.5px solid var(--accent);
            box-shadow: 0 0 22px var(--accent), inset 0 0 30px var(--accent);
            opacity: 0;
            animation: edge-in 1.4s ease-out 0.2s forwards,
                       edge-breathe 5s ease-in-out 1.6s infinite;
        }
        .stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            max-width: 360px;
            padding: 0 28px;
            text-align: center;
        }
        .glyph {
            opacity: 0;
            transform: scale(0.6);
            animation: glyph-in 1.1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s forwards;
        }
        .glyph .core { transform-box: fill-box; transform-origin: center;
            animation: core-breathe 4.5s ease-in-out 1.6s infinite; }
        .wordmark { font-size: 22px; letter-spacing: 0.01em; color: var(--ink); }
        .wordmark span { color: var(--faint); }
        .headline { font-size: 13px; color: var(--muted); min-height: 16px; }
        .detail { font-size: 11px; color: var(--faint); min-height: 14px; }
        .detail.alert { color: #f2b23e; }
        .track {
            margin-top: 8px;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
        }
        .bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.6s ease;
        }
        @keyframes edge-in { to { opacity: 0.32; } }
        @keyframes edge-breathe { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.4; } }
        @keyframes glyph-in { to { opacity: 1; transform: scale(1); } }
        @keyframes core-breathe {
            0%, 100% { opacity: 0.85; transform: scale(0.96); }
            50% { opacity: 1; transform: scale(1.06); }
        }
        @media (prefers-reduced-motion: reduce) {
            .edge, .glyph, .glyph .core { animation: none; opacity: 1; transform: none; }
            .edge { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="edge"></div>
    <div class="stage">
        <svg class="glyph" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
            <circle cx="42" cy="42" r="36" fill="none" stroke="var(--accent)" stroke-opacity="0.5" stroke-width="1.5" />
            <circle class="core" cx="42" cy="42" r="13" fill="var(--accent)" fill-opacity="0.92" />
            <path d="M24 52.5 A21 21 0 0 0 60 52.5" fill="none" stroke="var(--accent)" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <div class="wordmark">luca<span>os</span></div>
        <div class="headline" id="status">Waking Luca</div>
        <div class="detail" id="detail"></div>
        <div class="track"><div class="bar" id="progress"></div></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const progressBar = document.getElementById('progress');
        const statusText = document.getElementById('status');
        const detailText = document.getElementById('detail');

        // Same IPC contract as before, expressed calmly: the latest boot-log
        // message becomes a quiet status detail (no scrolling terminal), and
        // progress drives the hairline bar.
        ipcRenderer.on('boot-log', (event, { message, type, progress }) => {
            if (message) {
                detailText.textContent = message;
                detailText.classList.toggle('alert', type === 'error' || type === 'warn');
            }
            if (progress !== undefined) {
                progressBar.style.width = `${progress}%`;
            }
        });

        ipcRenderer.on('boot-status', (event, status) => {
            if (status) statusText.textContent = status;
        });
    </script>
</body>
</html>
