<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        :root {
            --accent: #7ca8ff;
            --ink: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.5);
            --faint: rgba(255, 255, 255, 0.34);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #0b0c0e;
            color: var(--ink);
            font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Edge-light: Luca incarnating into this host body. */
        .edge {
            position: fixed;
            inset: 0;
            pointer-events: none;
            border: 1.5px solid var(--accent);
            box-shadow: 0 0 22px var(--accent), inset 0 0 30px var(--accent);
            opacity: 0;
            animation: edge-in 1.4s ease-out 0.2s forwards,
                       edge-breathe 5s ease-in-out 1.6s infinite;
        }
        .stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            max-width: 360px;
            padding: 0 28px;
            text-align: center;
        }
        /* The Luca face — the identity, shown the way Apple shows an app icon at boot. */
        .face {
            width: 148px;
            height: auto;
            opacity: 0;
            transform: scale(0.78);
            filter: drop-shadow(0 0 34px rgba(124, 168, 255, 0.28));
            animation: face-in 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s forwards,
                       face-breathe 6.4s ease-in-out 1.7s infinite;
        }
        .wordmark { font-size: 21px; letter-spacing: 0.01em; color: var(--ink); }
        .wordmark span { color: var(--faint); }
        .headline { font-size: 13px; color: var(--muted); min-height: 16px; }
        .detail { font-size: 11px; color: var(--faint); min-height: 14px; }
        .detail.alert { color: #f2b23e; }
        .track {
            margin-top: 6px;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            overflow: hidden;
        }
        .bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            transition: width 0.6s ease;
        }
        @keyframes edge-in { to { opacity: 0.32; } }
        @keyframes edge-breathe { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.4; } }
        @keyframes face-in { to { opacity: 0.95; transform: scale(1); } }
        @keyframes face-breathe {
            0%, 100% { transform: scale(0.99); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            .edge, .face { animation: none; opacity: 1; transform: none; }
            .edge { opacity: 0.3; }
            .face { opacity: 0.95; }
        }
    </style>
</head>
<body>
    <div class="edge"></div>
    <div class="stage">
        <img class="face" src="luca-hologram.png" alt="Luca" />
        <div class="wordmark">luca<span>os</span></div>
        <div class="headline" id="status">Waking Luca</div>
        <div class="detail" id="detail"></div>
        <div class="track"><div class="bar" id="progress"></div></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const progressBar = document.getElementById('progress');
        const statusText = document.getElementById('status');
        const detailText = document.getElementById('detail');

        // Same IPC contract as before, expressed calmly: the latest boot-log
        // message becomes a quiet status detail (no scrolling terminal), and
        // progress drives the hairline bar.
        ipcRenderer.on('boot-log', (event, { message, type, progress }) => {
            if (message) {
                detailText.textContent = message;
                detailText.classList.toggle('alert', type === 'error' || type === 'warn');
            }
            if (progress !== undefined) {
                progressBar.style.width = `${progress}%`;
            }
        });

        ipcRenderer.on('boot-status', (event, status) => {
            if (status) statusText.textContent = status;
        });
    </script>
</body>
</html>
