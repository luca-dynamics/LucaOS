<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        :root {
            --luca-background-base: #111417;
            --luca-background-elevated: #1b2025;
            --luca-surface-glass: #1b2025;
            --luca-surface-solid: #1b2025;
            --luca-surface-hover: rgba(45, 52, 60, 0.66);
            --luca-text-primary: #f2f5f7;
            --luca-text-secondary: #bac5cc;
            --luca-text-tertiary: #89949c;
            --luca-accent-primary: #9fb3c2;
            --luca-accent-soft: #728898;
            --luca-material-opacity: 0.82;
            --luca-material-blur: 10px;
            --luca-material-glass-highlight: rgb(255 255 255 / 0.14);
            --luca-material-glass-rim: rgb(255 255 255 / 0.24);
            --luca-material-glass-shadow: rgb(0 0 0 / 0.18);
            --luca-material-glass-sheen: rgb(255 255 255 / 0.07);
            --luca-material-border-strength: 0.46;
            --luca-material-shadow: 0 30px 80px rgba(0, 0, 0, 0.42);
            --luca-shadow-soft: 0 18px 48px rgba(0, 0, 0, 0.34);
            --luca-shadow-glow: rgba(159, 179, 194, 0.14);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: var(--luca-background-base);
            color: var(--luca-text-primary);
            font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: drag;
        }
        .window-controls {
            position: fixed;
            top: 2px;
            right: 2px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-app-region: no-drag;
        }
        .window-control {
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--luca-text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            transition: color 140ms cubic-bezier(0.16, 1, 0.3, 1), transform 140ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media (hover: hover) and (pointer: fine) {
            .window-control:hover {
                color: var(--luca-text-primary);
            }
            .window-control.close:hover {
                color: #f87171;
            }
        }
        .window-control:active {
            transform: scale(0.97);
        }
        .stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            width: 100%;
            max-width: 560px;
            min-height: min(92vh, 420px);
            padding: 0 28px 26px;
            text-align: center;
        }
        /* The Luca face sits fully visible behind the boot copy. */
        .face {
            position: absolute;
            top: 54%;
            left: 50%;
            z-index: 0;
            width: min(76vw, 340px);
            height: auto;
            opacity: 0.9;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 34px var(--luca-shadow-glow));
            animation: none;
            pointer-events: none;
        }
        .wordmark,
        .headline,
        .detail,
        .track {
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 18px var(--luca-material-glass-shadow);
        }
        .wordmark {
            font-family: "Segoe UI Variable Display", "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            font-size: 25px;
            font-weight: 650;
            letter-spacing: -0.025em;
            color: var(--luca-text-primary);
        }
        .headline { font-size: 13px; color: var(--luca-text-secondary); min-height: 16px; }
        .detail { font-size: 11px; color: var(--luca-text-tertiary); min-height: 14px; }
        .detail.alert { color: #f2b23e; }
        .track {
            margin-top: 6px;
            width: min(100%, 360px);
            height: 2px;
            background: color-mix(in srgb, var(--luca-text-tertiary) 20%, transparent);
            border-radius: 999px;
            overflow: hidden;
        }
        .bar {
            height: 100%;
            width: 0%;
            background: var(--luca-accent-primary);
            box-shadow: 0 0 10px var(--luca-shadow-glow);
            transition: width 0.6s ease;
        }
        @media (prefers-reduced-motion: reduce) {
            .face {
                animation: none;
                opacity: 0.9;
                transform: translate(-50%, -50%);
            }
            .bar,
            .window-control {
                transition-duration: 0.01ms;
            }
        }
        @media (prefers-contrast: more) {
            .window-control {
                color: var(--luca-text-primary);
            }
        }
    </style>
</head>
<body>
    <div class="window-controls" aria-label="Window controls">
        <button class="window-control" type="button" aria-label="Minimize window" title="Minimize" data-window-action="minimize">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M3.5 8.5h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" />
            </svg>
        </button>
        <button class="window-control" type="button" aria-label="Maximize or restore window" title="Maximize" data-window-action="maximize">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none" />
            </svg>
        </button>
        <button class="window-control close" type="button" aria-label="Close window" title="Close" data-window-action="close">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" />
            </svg>
        </button>
    </div>
    <div class="stage">
        <img class="face" src="luca-hologram.png" alt="Luca" />
        <div class="wordmark">LucaOS</div>
        <div class="headline" id="status">Waking Luca</div>
        <div class="detail" id="detail"></div>
        <div class="track"><div class="bar" id="progress"></div></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const progressBar = document.getElementById('progress');
        const statusText = document.getElementById('status');
        const detailText = document.getElementById('detail');
        document.querySelectorAll('[data-window-action]').forEach((button) => {
            button.addEventListener('click', () => {
                ipcRenderer.send(`window-${button.dataset.windowAction}`);
            });
        });

        // Same IPC contract as before, expressed calmly. Raw boot-log lines
        // are developer telemetry (they still reach the console and Medic);
        // the being speaks in its own words here. Technical detail surfaces
        // only when something actually goes wrong.
        const speak = (message) => {
            const m = message.toLowerCase();
            if (/(app ready|interface ready|launch)/.test(m)) return "Here.";
            if (/(vite|frontend|interface|window)/.test(m)) return "Opening my eyes";
            if (/(cortex|graph db|memory)/.test(m)) return "Connecting memory";
            if (/(igniting|logic core|node|server|port)/.test(m)) return "Starting my core";
            if (/(wait|ready\.)/.test(m)) return "Almost there";
            if (/(python|model|ollama|brain)/.test(m)) return "Warming up intelligence";
            return "Waking Luca";
        };
        ipcRenderer.on('boot-log', (event, { message, type, progress }) => {
            if (message) {
                if (type === 'error') {
                    // Honesty over calm when it breaks: show the real reason.
                    detailText.textContent = message;
                    detailText.classList.add('alert');
                } else {
                    detailText.textContent = speak(message);
                    detailText.classList.remove('alert');
                }
            }
            if (progress !== undefined) {
                progressBar.style.width = `${progress}%`;
            }
        });

        ipcRenderer.on('boot-status', (event, status) => {
            if (status) statusText.textContent = status;
        });
    </script>
</body>
</html>
