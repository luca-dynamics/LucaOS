<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        :root {
            --ink: #2b303a;
            --ink-2: #5b636f;
            --ink-3: #8b929d;
            --accent: #7fa9d8;
            --track: rgba(43, 48, 58, 0.09);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            color: var(--ink);
            font-family: "Segoe UI Variable Display", -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
            -webkit-app-region: drag;
            /* Light frosted environment with a soft glow behind the face. */
            background:
                radial-gradient(70% 90% at 68% 46%, #ffffff 0%, rgba(255,255,255,0) 55%),
                radial-gradient(120% 130% at 78% 40%, #f4f8fb 0%, #eef2f6 46%, #e4eaf0 100%);
        }
        .window-controls {
            position: fixed;
            top: 6px;
            right: 8px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 2px;
            -webkit-app-region: no-drag;
        }
        .window-control {
            width: 30px;
            height: 26px;
            border: 0;
            border-radius: 7px;
            background: transparent;
            color: var(--ink-2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            transition: color 140ms ease, background 140ms ease;
        }
        @media (hover: hover) and (pointer: fine) {
            .window-control:hover { color: var(--ink); background: rgba(43,48,58,0.06); }
            .window-control.close:hover { color: #d5504a; background: rgba(213,80,74,0.1); }
        }
        /* Small top-left product tag, mirroring the mockup window chrome. */
        .titletag {
            position: fixed;
            top: 12px;
            left: 16px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: var(--ink-2);
        }
        .titletag .mini {
            width: 15px; height: 15px;
            animation: spin 1.4s linear infinite;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* The Luca hologram face, large and center-right. */
        .face {
            position: absolute;
            right: 6%;
            top: 50%;
            transform: translateY(-50%);
            height: min(86vh, 640px);
            width: auto;
            max-width: 52vw;
            object-fit: contain;
            /* High-key blend: lightened + desaturated into the pale
               environment, with the neck/shoulders dissolving out through a
               bottom gradient mask (per the reference frame). */
            opacity: 0.82;
            filter: brightness(1.32) saturate(0.62) contrast(0.94)
                drop-shadow(0 24px 70px rgba(120, 160, 205, 0.22));
            -webkit-mask-image: linear-gradient(to bottom, black 55%, rgba(0, 0, 0, 0.55) 76%, transparent 95%);
            mask-image: linear-gradient(to bottom, black 55%, rgba(0, 0, 0, 0.55) 76%, transparent 95%);
            pointer-events: none;
            user-select: none;
        }
        /* Center-left brand block: dotted spinner + wordmark + subtitle. */
        .brand {
            position: absolute;
            left: 8%;
            top: 46%;
            transform: translateY(-50%);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
        }
        /* Spinner + wordmark share one row (spinner centered on the LucaOS
           line); the subtitle sits centered on the line below. */
        .brand-line {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .spinner {
            width: 34px; height: 34px;
            flex: none;
            animation: spin 1.5s linear infinite;
        }
        .spinner circle,
        .titletag .mini circle {
            fill: var(--ink-3);
        }
        .wordmark {
            font-size: 46px;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--ink);
            line-height: 1;
        }
        .subtitle {
            font-size: 15px;
            color: var(--ink-2);
            margin-top: 8px;
            text-align: center;
            letter-spacing: 0.01em;
        }
        /* Lower-left progress cluster. */
        .awaken {
            position: absolute;
            left: 8%;
            bottom: 15%;
            width: min(38vw, 340px);
        }
        .headline {
            font-size: 13px;
            color: var(--ink-3);
            margin-bottom: 10px;
            letter-spacing: 0.01em;
        }
        .track {
            height: 3px;
            width: 100%;
            background: var(--track);
            border-radius: 999px;
            overflow: hidden;
        }
        .bar {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #a6c6e8 0%, #cfe0f2 100%);
            box-shadow: 0 0 10px rgba(127, 169, 216, 0.5);
            transition: width 0.6s ease;
        }
        .detail {
            font-size: 11px;
            color: var(--ink-3);
            margin-top: 8px;
            min-height: 14px;
        }
        .detail.alert { color: #c9803a; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .spinner, .titletag .mini { animation: none; }
            .bar { transition-duration: 0.01ms; }
        }
        /* Small window (the native 600x400 splash): one centered column —
           face, then spinner + LucaOS with the subtitle beneath, then the
           progress cluster. Everything shares the same center axis. */
        @media (max-width: 640px) {
            .face { position: static; display: block; margin: 5vh auto 0; height: 38vh; max-width: 70vw; transform: none; }
            .brand { position: static; transform: none; display: flex; width: fit-content; margin: 3.5vh auto 0; }
            .wordmark { font-size: 34px; }
            .spinner { width: 26px; height: 26px; }
            .awaken { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8%; width: 74vw; text-align: center; }
            .headline { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="titletag">
        <svg class="mini" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="5" r="2.6" opacity="1" />
            <circle cx="30.6" cy="9.4" r="2.4" opacity="0.85" />
            <circle cx="35" cy="20" r="2.2" opacity="0.72" />
            <circle cx="30.6" cy="30.6" r="2" opacity="0.58" />
            <circle cx="20" cy="35" r="1.9" opacity="0.44" />
            <circle cx="9.4" cy="30.6" r="1.8" opacity="0.32" />
            <circle cx="5" cy="20" r="1.7" opacity="0.22" />
            <circle cx="9.4" cy="9.4" r="1.6" opacity="0.15" />
        </svg>
        LucaOS
    </div>
    <div class="window-controls" aria-label="Window controls">
        <button class="window-control" type="button" aria-label="Minimize window" title="Minimize" data-window-action="minimize">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M3.5 8.5h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" />
            </svg>
        </button>
        <button class="window-control" type="button" aria-label="Maximize or restore window" title="Maximize" data-window-action="maximize">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2" fill="none" />
            </svg>
        </button>
        <button class="window-control close" type="button" aria-label="Close window" title="Close" data-window-action="close">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" />
            </svg>
        </button>
    </div>

    <div class="stage">
        <img class="face" src="luca-hologram.png" alt="Luca" />
        <div class="brand">
            <div class="brand-line">
                <svg class="spinner" viewBox="0 0 40 40" aria-hidden="true">
                    <circle cx="20" cy="5" r="2.6" opacity="1" />
                    <circle cx="30.6" cy="9.4" r="2.4" opacity="0.85" />
                    <circle cx="35" cy="20" r="2.2" opacity="0.72" />
                    <circle cx="30.6" cy="30.6" r="2" opacity="0.58" />
                    <circle cx="20" cy="35" r="1.9" opacity="0.44" />
                    <circle cx="9.4" cy="30.6" r="1.8" opacity="0.32" />
                    <circle cx="5" cy="20" r="1.7" opacity="0.22" />
                    <circle cx="9.4" cy="9.4" r="1.6" opacity="0.15" />
                </svg>
                <div class="wordmark">LucaOS</div>
            </div>
            <div class="subtitle">Host-native personal AI OS</div>
        </div>
        <div class="awaken">
            <div class="headline" id="status">Awakening Luca…</div>
            <div class="track"><div class="bar" id="progress"></div></div>
            <div class="detail" id="detail"></div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const progressBar = document.getElementById('progress');
        const statusText = document.getElementById('status');
        const detailText = document.getElementById('detail');
        document.querySelectorAll('[data-window-action]').forEach((button) => {
            button.addEventListener('click', () => {
                ipcRenderer.send(`window-${button.dataset.windowAction}`);
            });
        });

        // Raw boot-log lines are developer telemetry; here Luca speaks calmly.
        // The big headline stays "Awakening Luca…"; the small detail line
        // reflects the current phase, and surfaces the real reason on error.
        const speak = (message) => {
            const m = message.toLowerCase();
            if (/(app ready|interface ready|launch)/.test(m)) return "Ready";
            if (/(vite|frontend|interface|window)/.test(m)) return "Opening the interface";
            if (/(cortex|graph db|memory)/.test(m)) return "Connecting memory";
            if (/(igniting|logic core|node|server|port)/.test(m)) return "Starting the core";
            if (/(wait|ready\.)/.test(m)) return "Almost there";
            if (/(python|model|ollama|brain)/.test(m)) return "Warming up intelligence";
            return "Awakening Luca…";
        };
        ipcRenderer.on('boot-log', (event, { message, type, progress }) => {
            if (message) {
                if (type === 'error') {
                    detailText.textContent = message;
                    detailText.classList.add('alert');
                } else {
                    detailText.textContent = speak(message);
                    detailText.classList.remove('alert');
                }
            }
            if (progress !== undefined) {
                progressBar.style.width = `${progress}%`;
            }
        });

        // boot-status carries the phase label; keep "Awakening Luca…" as the
        // resting headline and only replace it with meaningful phase text.
        ipcRenderer.on('boot-status', (event, status) => {
            if (status) statusText.textContent = status;
        });
    </script>
</body>
</html>
